# Infrastructure and services for the Notification Platform (issue #7 for the
# infra, issue #8 for the Notification API, issue #9 for the Email Channel
# Service).
#
# This file provisions RabbitMQ, Redis, a single shared Postgres container,
# the Aspire Dashboard, and the platform's services. Deliberately no init SQL
# and no CREATE DATABASE anywhere: per ADR-0002, each service self-provisions
# its own logical database via EF Core Migrate() at startup (see
# src/BuildingBlocks/Persistence/DatabaseMigrationExtensions.cs), which is
# also why services connect as one shared superuser rather than per-service
# roles.
name: notification-platform

networks:
  notification-platform:
    name: notification-platform

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - notification-platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - notification-platform
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - notification-platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_DASHBOARD_UI_PORT}:18888"
      - "${ASPIRE_DASHBOARD_OTLP_PORT}:18889"
    networks:
      - notification-platform

  notification-api:
    build:
      context: .
      dockerfile: src/NotificationApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT__SIGNINGKEY: ${JWT_SIGNING_KEY}
      OTEL_SERVICE_NAME: notification-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "${NOTIFICATION_API_PORT}:8080"
    networks:
      - notification-platform
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  email-channel-service:
    build:
      context: .
      dockerfile: src/EmailChannelService/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: email-channel-service
    networks:
      - notification-platform
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # aspire-dashboard has no healthcheck defined (its image is distroless -
      # no shell/curl/wget to probe with), so this can only wait for it to
      # start, not for it to be ready.
      aspire-dashboard:
        condition: service_started

  sms-channel-service:
    build:
      context: .
      dockerfile: src/SmsChannelService/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: sms-channel-service
    networks:
      - notification-platform
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # aspire-dashboard has no healthcheck defined (its image is distroless -
      # no shell/curl/wget to probe with), so this can only wait for it to
      # start, not for it to be ready.
      aspire-dashboard:
        condition: service_started

  push-channel-service:
    build:
      context: .
      dockerfile: src/PushChannelService/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: push-channel-service
    networks:
      - notification-platform
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # aspire-dashboard has no healthcheck defined (its image is distroless -
      # no shell/curl/wget to probe with), so this can only wait for it to
      # start, not for it to be ready.
      aspire-dashboard:
        condition: service_started
